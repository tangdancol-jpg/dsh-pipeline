# ============================================================================
# dsh-pipeline —— bundle patch（插件包自己的挂载声明）
# ============================================================================
# 这个文件位于**插件包内**，由 package.json 的 `dsh.bundle.patch` 引用。
# 安装时由插件管理器读取，把下面这一行插进当前 profile 的 Cordis 配置树。
#
# !! 它不是用户 profile 下的 ~/.dsh/profiles/<name>/cordis.patch.yml。
#    用户 profile 的那个文件是「按 id 定位覆盖」，语义不同，不要混用。
#
# 下面 `id:` 的值 = 本插件在 profile 里的 entry id，必须与 index.js 的 NS 一致。
#
# config 字段说明（全部有默认值，不写 config 也能跑）：
#   enabled             总开关。false = 完全不注册工具、不注册守门。
#   guardEnabled        硬拦截总开关。true = 越权 / 跳步 / 无 OK 关单 会被拒。
#   artifactDirName     流水线工作区目录名（默认 .pipeline），落在项目根下。
#   maxReworkPerLeg     单条打回链的最大次数（默认 2；审核→编写、测试→编写 各自计数）。
#   guardFileTools      参与「测试/审核不得改代码」「主对话不得读代码」判定的写/读工具名。
#   guardShellTools     参与 shell 旁路判定（best-effort，字符串匹配）的 shell 工具名。
#   guardMainReadsCode  是否拦截主对话读取受保护路径的代码正文（默认 true）。
#   transport           角色驱动通道：auto | subagent | manual（默认 auto）。
#                       auto = 有 ctx.subagents 就用真实子代理，否则退回 manual。
#   spawnRoles          是否由本插件真的创建子代理会话（默认 true）。
#                       自测 / 演示时置 false，只发令牌不建会话（零副作用）。
#   defaultTier         规则引擎拿不准时的兜底档（默认 L1，宁高不低）。
#   requireBilingual    预留字段，本插件当前不输出双语界面。
#
#   —— 以下是「多 AI 协调」功能开关（DSH 窗口右上角那个按钮控制的同一个开关位）——
#   switchDefaultOn     首次启动（还没有状态文件）时的初值。默认 true。
#   switchStateFile     开关状态文件。留空 = <项目根>/.pipeline/switch.json。
#                       状态会落盘，所以重启后保持上次的选择。
#   switchRoute         是否挂载开关的 HTTP 端点 /.dsh-pipeline（客户端 UI 靠它
#                       读写宿主开关）。拿不到 ctx.webServer 时自动跳过。
#                       ⚠ 如果你的 profile 把 webServer 配成对外监听，设成 false。
#
#   —— 以下是「人工介入」通道（用户只与主对话相连，角色只能向上发起请求）——
#   humanRequestTimeoutHours  人工介入请求的默认截止时长（小时）。0（默认）= 不设截止。
#                             只有设了截止，才允许用 answer_source=timeout 按事前声明的
#                             策略放行 —— 没有截止时间就不存在"超时"，那会变成绕过用户
#                             答复的后门。
#   requireHumanConfirmCode   是否强制答复回带转告时给出的确认码（默认 false）。
#                             设 true 之后主对话必须把用户答复里的 HC-xxxx 抄回来才作数，
#                             把"替用户拍板"的门槛从"编一句话"抬到"连确认码一起编"。
# ============================================================================

- insert:
    - id: dsh-pipeline
      name: 'dsh-pipeline'
      config:
        enabled: true
        guardEnabled: true
        artifactDirName: .pipeline
        maxReworkPerLeg: 2
        transport: auto
        spawnRoles: true
        guardMainReadsCode: true
        switchDefaultOn: true
        switchRoute: true
        humanRequestTimeoutHours: 0
        requireHumanConfirmCode: false
